name: Build & Release EXEs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build CLI (pdf_dewatermark.exe)
        run: python -m PyInstaller -F --clean --name pdf_dewatermark pdf_dewatermark.py

      - name: Build GUI (Extreme_PDF_Cleaner.exe)
        run: python -m PyInstaller -F -w --clean --name Extreme_PDF_Cleaner main.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exes
          path: |
            dist/*.exe
            batch_clean.py
            verify_clean.py
            pixel_check.py
          if-no-files-found: error

      - name: Attach EXEs to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pdf_dewatermark.exe
            dist/Extreme_PDF_Cleaner.exe
            batch_clean.py
            verify_clean.py
            pixel_check.py
