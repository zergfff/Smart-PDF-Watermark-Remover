name: Build & Release EXEs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build CLI (pdf_dewatermark.exe)
        run: python -m PyInstaller -F --clean --name pdf_dewatermark pdf_dewatermark.py

      - name: Build Agent CLI (dewatermark_agent.exe)
        run: python -m PyInstaller -F --clean --name dewatermark_agent dewatermark_agent.py

      - name: Build GUI onefile (Extreme_PDF_Cleaner.exe)
        run: python -m PyInstaller -F -w --clean --name Extreme_PDF_Cleaner main.py

      - name: Build GUI onedir (fast startup) + zip (含 agent exe)
        run: |
          python -m PyInstaller -w --clean --distpath dist_dir --workpath build_on --name Extreme_PDF_Cleaner main.py
          python -c "import shutil; shutil.copy('dist/dewatermark_agent.exe', 'dist_dir/Extreme_PDF_Cleaner/')"
          python -c "import shutil; shutil.make_archive('Extreme_PDF_Cleaner_Portable', 'zip', 'dist_dir', 'Extreme_PDF_Cleaner')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exes
          path: |
            dist/*.exe
            Extreme_PDF_Cleaner_Portable.zip
            pdf_dewatermark.py
            batch_clean.py
            verify_clean.py
            pixel_check.py
            dewatermark_agent.py
          if-no-files-found: error

      - name: Attach EXEs to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dewatermark_agent.exe
            Extreme_PDF_Cleaner_Portable.zip
